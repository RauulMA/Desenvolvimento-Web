<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrosel</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
        }
        .scene {
            margin: 120px auto;
            width: 210px;
            position: relative;
            aspect-ratio: 4 / 5; /* define proporção da imagem, logo 4 (largura) por 5 (altura)*/
            perspective: 1000px;
        }
        .scene1 {
            margin: 0 auto;
            width: 230px;
            position: relative;
            aspect-ratio: 4 / 5; /* define proporção da imagem, logo 4 (largura) por 5 (altura)*/
            perspective: 500px;
        }
        .carousel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d; /*Quando há uma transformação de si para 3D, isso preserva para teus filhos */
            animation: rotate 30s infinite linear;
        }
        .carousel img {
            position: absolute;
            left: 0;
            top: 0;
            width: 190px;
            aspect-ratio: 4 / 5;
            border-radius: 10px;
            transform: rotateY(var(--i)) translateZ(288px);
            /* transform: rotateZ(var(--w)) translateY(100px); */
            /* Roda Y, depois Z */
        }
        @keyframes rotate {
            0%{transform: rotateY(360deg)}
            100%{transform: rotateY(0deg)}
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="carousel">
            <img src="/Desenvolvimento-Web/DW-main/Aula5 - Projeto-carrosel/imgs/1.jpg" alt="imagem do Carrosel" style="--i: 000deg">
            <img src="/Desenvolvimento-Web/DW-main/Aula5 - Projeto-carrosel/imgs/2.jpg" alt="imagem do Carrosel" style="--i: 040deg">
            <img src="/Desenvolvimento-Web/DW-main/Aula5 - Projeto-carrosel/imgs/3.jpg" alt="imagem do Carrosel" style="--i: 080deg">
            <img src="/Desenvolvimento-Web/DW-main/Aula5 - Projeto-carrosel/imgs/1.jpg" alt="imagem do Carrosel" style="--i: 120deg">
            <img src="/Desenvolvimento-Web/DW-main/Aula5 - Projeto-carrosel/imgs/2.jpg" alt="imagem do Carrosel" style="--i: 160deg">
            <img src="/Desenvolvimento-Web/DW-main/Aula5 - Projeto-carrosel/imgs/3.jpg" alt="imagem do Carrosel" style="--i: 200deg">
            <img src="/Desenvolvimento-Web/DW-main/Aula5 - Projeto-carrosel/imgs/1.jpg" alt="imagem do Carrosel" style="--i: 240deg">
            <img src="/Desenvolvimento-Web/DW-main/Aula5 - Projeto-carrosel/imgs/2.jpg" alt="imagem do Carrosel" style="--i: 280deg">
            <img src="/Desenvolvimento-Web/DW-main/Aula5 - Projeto-carrosel/imgs/3.jpg" alt="imagem do Carrosel" style="--i: 320deg">
        </div>
    </div>
</body>
</html>
