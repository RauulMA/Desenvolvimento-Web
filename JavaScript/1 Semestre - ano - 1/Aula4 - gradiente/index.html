<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
                    #grad {
                height: 200px;
                background-image: linear-gradient(to top, red, yellow); /* to bottom é padrão */
            }
            div.vazio {
                width: 100px;
                height: 100px;
                border: solid 1px black;
                position: absolute; /*z-index 2 - sobreposição;*/
                background-color: blue;
                left: 200px;
                top: 150px;
            }
            div.transform {
                width: 100px;
                height: 100px;
                position: absolute; /*z-index 2 - sobreposição;*/
                background-color: red;
                left: 200px;
                top: 150px;
                transition: transform 1.5s; /*trasition: transform: all 1s;*/
            }
            div.transform:hover {
                transform: translate(10px, 20px);
                transform: rotate(-45deg) translate(10px, 20px);
                transform: scale(0.0001, 100);
                transform: skew(20deg, 45deg) translate(1000px, 20px) rotate(360deg);
            }
            h1 {
                animation-name: fade;
                animation-duration: 2s;
                animation-iteration-count: infinite;
            }

            @keyframes fade /*específico para fade*/{
                /* from {}
                to {} */
                0% {opacity: 0; color: green; transform: scale(2);}
                100% {opacity: 1; color: blue;}
            }
    </style>
</head>
<body>
    <div id="grad">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Corporis, perferendis.</p>
    </div>

    <div class="vazio"></div>
    <div class="transform">Texto</div>
    <h1>Título Animado!</h1>
</body>
</html>
