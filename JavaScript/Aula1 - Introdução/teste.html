<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class=".a">
        <input type="text" class=".teste">
        <br>
        <input type="phone">
        <br>
        <input type="email">
        <form action="">

            <h2>Cadastro</h2>
            <p>Nome</p>

            <label for="nome_sobrenome">Nome e Sobrenome:</label>
            <input type="text" name="nome_sobrenome" placeholder="Nome Sobrenome">

            <p>Selecione o seu gênero</p>

            <input type="radio" name="genero" value="M">
            <label for="genero">M</label>
            <br>
            <input type="radio" name="genero" value="F">
            <label for="genero">F</label>
            <br>
            <input type="radio" name="genero" value="O">
            <label for="genero">O</label>

            <p>Selecione quais meios de transporte usa</p>

            <a href="teste2.html"><input type="checkbox" name="transporte" value="Carro"></a>
            <label for="Cadastro">Carro</label>
            <br><br>
            <input type="checkbox" name="transporte" value="Metrô">
            <label for="Cadastro">Metrô</label>
            <br><br>
            <input type="checkbox" name="transporte" value="ônibus">
            <label for="Cadastro">ônibus</label>
            <br><br>

            <p>Selecione</p>

            <select name="tamanho">
                <option value="g">grande</option>
                <option value="m">médio</option>
                <option value="p">pequeno</option>
            </select>
            <br><br>

            <textarea name="opiniao" placeholder="Digite sua opinião"></textarea>
            <br><br>

            <fieldset>
                <legend>Aceite os termos</legend>
                <input type="checkbox" name="Aceite" value="ok" required>
                <label for="Aceite">Aceite os termos!</label>
            </fieldset>
            <br><br>

            <button type="submit">Enviar</button>
            <a href="teste2.html"><button type="button">Limpar</button></a>
        </form>
    </div>
    <style></style>
</body>
</html>
